[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=dependencies/forge-std-1.14.0/src/",
  "@openzeppelin/contracts/=dependencies/openzeppelin-contracts-5.5.0/contracts/",
]

[fmt]
line_length = 120

[soldeer]
remappings_generate = false

[dependencies]
forge-std = { version = "1.14.0", git = "https://github.com/foundry-rs/forge-std.git", tag = "v1.14.0" }
openzeppelin-contracts = { version = "5.5.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.5.0" }
